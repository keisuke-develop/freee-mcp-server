AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: freee Remote MCP Server - HTTP API + Lambda + Cognito OAuth

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: デプロイ識別子

  SecretName:
    Type: String
    Default: freee/mcp-server
    Description: Secrets Managerのシークレット名（freee認証情報）

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Lambdaのログレベル

Globals:
  Function:
    Runtime: python3.13
    Timeout: 28
    MemorySize: 256
    Environment:
      Variables:
        SECRET_NAME: !Ref SecretName
        LOG_LEVEL: !Ref LogLevel
        FREEE_API_BASE_URL: "https://api.freee.co.jp"
        POWERTOOLS_SERVICE_NAME: freee-mcp-server
        OAUTH_TABLE_NAME: !Ref FreeeeOauthStateTable
        COGNITO_USER_POOL_ID: !Ref FreeeeUserPool
        COGNITO_APP_CLIENT_NAME: !Sub "freee-mcp-oauth-${StageName}"
        COGNITO_DOMAIN_URL: !Sub "https://${FreeeeUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
        COGNITO_ISSUER_URL: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FreeeeUserPool}"

Resources:
  FreeeeOauthStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "freee-mcp-oauth-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  FreeeeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "freee-mcp-users-${StageName}"
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          Required: false
          Mutable: true

  FreeeeOauthAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FreeeeUserPool
      ClientName: !Sub "freee-mcp-oauth-${StageName}"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "https://${FreeeeMcpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/oauth/callback"
      LogoutURLs:
        - !Sub "https://${FreeeeMcpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  FreeeeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "freeemcp-${AWS::AccountId}-${StageName}"
      UserPoolId: !Ref FreeeeUserPool

  FreeeeMcpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "freee-mcp-lambda-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FreeeSecretAndOAuthAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteFreeeSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
              - Sid: ReadWriteOauthState
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt FreeeeOauthStateTable.Arn
              - Sid: DiscoverCognitoClient
                Effect: Allow
                Action:
                  - cognito-idp:ListUserPoolClients
                  - cognito-idp:DescribeUserPoolClient
                Resource: "*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/freee-mcp-server-*:*"

  FreeeeMcpHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "freee-mcp-api-${StageName}"
      Description: freee Remote MCP Server API
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
          - mcp-protocol-version
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  FreeeeMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "freee-mcp-server-${StageName}"
      CodeUri: ../app/
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt FreeeeMcpLambdaRole.Arn
      Description: freee Remote MCP Server
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /health
            Method: GET
        ProtectedResourceMetadata:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /.well-known/oauth-protected-resource
            Method: GET
        AuthorizationServerMetadata:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /.well-known/oauth-authorization-server
            Method: GET
        RegisterClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /register
            Method: POST
        Authorize:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /authorize
            Method: GET
        OAuthCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /oauth/callback
            Method: GET
        TokenExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /token
            Method: POST
        McpEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref FreeeeMcpHttpApi
            Path: /mcp
            Method: POST

  FreeeeMcpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/freee-mcp-server-${StageName}"
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: Remote MCP Server のエンドポイントURL
    Value: !Sub "https://${FreeeeMcpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  ApiBaseUrl:
    Description: Remote MCP Server のベースURL
    Value: !Sub "https://${FreeeeMcpHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionArn:
    Description: Lambda FunctionのARN
    Value: !GetAtt FreeeeMcpFunction.Arn

  HttpApiId:
    Description: HTTP API Gateway の ID
    Value: !Ref FreeeeMcpHttpApi

  CognitoIssuerUrl:
    Description: Cognito issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FreeeeUserPool}"

  CognitoUserPoolId:
    Description: Cognito user pool ID
    Value: !Ref FreeeeUserPool

  CognitoHostedUiUrl:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${FreeeeUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoAppClientId:
    Description: Cognito app client ID
    Value: !Ref FreeeeOauthAppClient
